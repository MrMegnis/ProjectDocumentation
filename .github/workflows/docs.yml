name: Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'style-guide-project/docs/**'
      - 'style-guide-project/mkdocs.yml'
      - 'style-guide-project/requirements.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'style-guide-project/docs/**'
      - 'style-guide-project/mkdocs.yml'
      - 'style-guide-project/requirements.txt'
      - '.github/workflows/docs.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: style-guide-project
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: style-guide-project/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build MkDocs (strict)
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: style-guide-project/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4